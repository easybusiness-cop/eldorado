version: '3.8'

services:
  # 1. Relational database for corporate schemas
  postgres:
    image: postgres:15-alpine
    container_name: munderdifflin-postgres
    environment:
      POSTGRES_DB: munderdifflin
      POSTGRES_USER: munder_admin
      POSTGRES_PASSWORD: munder_secure_password_9901
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munder_admin -d munderdifflin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for quick key-value session scopes and caching
  redis:
    image: redis:7-alpine
    container_name: munderdifflin-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. NATS for high throughput enterprise event streaming
  nats:
    image: nats:2.9-alpine
    container_name: munderdifflin-nats
    ports:
      - "4222:4222"
      - "8222:8222" # Monitor port
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. HashiCorp Vault for secure corporate secrets management
  vault:
    image: hashicorp/vault:1.13
    container_name: munderdifflin-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "munder_root_token_2026"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vaultdata:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 5. Temporal for durable mission workflow orchestrations
  temporal:
    image: temporalio/admin-tools:1.20
    container_name: munderdifflin-temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    ports:
      - "7233:7233"
      - "8088:8088" # Temporal UI Web
    depends_on:
      - postgres

  # 6. Munderdifflin Corporate Control Plane Application
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munderdifflin-control-plane
    environment:
      - PORT=3000
      - NODE_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEBHOOK_SECRET=whsec_default_munder_sig
      - DATABASE_URL=postgresql://munder_admin:munder_secure_password_9901@postgres:5432/munderdifflin
      - VAULT_TOKEN=munder_root_token_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  vaultdata:
